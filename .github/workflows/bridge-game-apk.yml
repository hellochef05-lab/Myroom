name: Build Bridge Game APK
on:
  push:
    branches: [bridge-game-deploy]
    paths:
      - 'bridge-game/android/**'
      - '.github/workflows/bridge-game-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: bridge-game/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-game-apk
          path: bridge-game/android/app/build/outputs/apk/debug/app-debug.apk
